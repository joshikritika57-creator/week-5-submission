<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Innova single page application simulation with client-side routing.">
<title>Innova SPA</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#app">Skip to content</a>

<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/" data-route="home" aria-label="Innova home">INNOVA</a>
    <nav aria-label="Primary navigation">
      <a href="/" data-route="home">Home</a>
      <a href="/services" data-route="services">Services</a>
      <a href="/about" data-route="about">About</a>
      <a href="/contact" data-route="contact">Contact</a>
    </nav>
  </div>
</header>

<main id="app" class="container" tabindex="-1" aria-live="polite"></main>

<footer class="site-footer">
  <div class="container footer-inner">
    <span>© 2026 Innova SPA</span>
    <button id="backButton" class="text-button" type="button">Back</button>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
